# ==============================================================================
# CampusGrid Nginx Production Configuration Configuration
# Save this file to /etc/nginx/sites-available/campusgrid on your VM,
# link it to /etc/nginx/sites-enabled/campusgrid, and run Certbot.
# ==============================================================================

# Common WebSocket Proxy Settings Block
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 1. Web App & API Gateway Configuration (campusgrid.sahuja.in) ---
server {
    listen 80;
    server_name campusgrid.sahuja.in;

    # Allow large file uploads (Blender scenes, ML datasets, etc.)
    client_max_body_size 5G;

    # FastAPI REST endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI WebSockets Connection Manager
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering and extend timeouts for long-lived WS connections
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Interactive API Docs, Health Check, and Metrics
    location ~ ^/(docs|redoc|openapi.json|health|metrics) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Web Console Admin Console
    location /minio/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Frontend pages (all other requests)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 2. S3 Storage API Configuration (s3-campusgrid.sahuja.in) ---
server {
    listen 80;
    server_name s3-campusgrid.sahuja.in;

    # Allow upload sizes matching MinIO bucket maximum limits
    client_max_body_size 5G;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host; # Crucial: SigV4 uses host header validation!
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering to allow smooth streaming uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
